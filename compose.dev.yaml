services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development

    # Process-level parallelism: 4 workers = 4 processes, 4 event loops,
    # 4 connection pools. Total pool budget = workers x (pool_size +
    # max_overflow) = 4 x 25 = 100 = Postgres max_connections.
    # NOTE: --workers is incompatible with --reload — code changes now
    # need a recreate (also removes the file-watcher as a CPU confounder).
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]

    env_file:
      - ./server/.env

    environment:
      # Inside the compose network the database is reachable as `postgres`,
      # not localhost — real env vars override the .env value.
      ATLAS_DATABASE_URL: postgresql+psycopg_async://atlas:atlas@postgres:5432/atlas

    ports:
      - "8000:8000"

    volumes:
      - ./server/app:/app/app
      - ./server/tests:/app/tests

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Load generator for database experiments — own container so it never
  # competes with the server for CPU. Run ad hoc:
  #   docker compose -f compose.yaml -f compose.dev.yaml run --rm loadgen \
  #     python -m experiments.load_test --url http://server:8000 --qps 100
  loadgen:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    command: ["sleep", "infinity"]
    volumes:
      - ./server/experiments:/app/experiments

volumes:
  postgres_data: