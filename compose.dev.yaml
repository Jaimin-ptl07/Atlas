services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development

    env_file:
      - ./server/.env

    environment:
      # Inside the compose network the database is reachable as `postgres`,
      # not localhost — real env vars override the .env value.
      ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas@postgres:5432/atlas

    ports:
      - "8000:8000"

    volumes:
      - ./server/app:/app/app
      - ./server/tests:/app/tests

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: